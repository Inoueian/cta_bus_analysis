[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cta-bus-analysis"
version = "0.1.0"
description = "Empirical wait-time and travel-time distributions for CTA bus routes"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0,<3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab>=4"]

[tool.setuptools]
packages = ["cta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
