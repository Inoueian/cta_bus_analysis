[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cta-bus"
version = "0.1.0"
description = "CTA bus wait-time and travel-time analysis on Mansueto StopWatch data"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cta_bus = ["*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
